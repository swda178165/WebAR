<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新家 3D 平面</title>
<meta name="description" content="把 CAD 平面圖變成可拖拉編輯的 3D 模型，並可匯出 DXF 給 AutoCAD。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/", "three/examples/jsm/": "./vendor/three/addons/", "three-mesh-bvh": "./vendor/three-mesh-bvh/index.module.js", "three-gpu-pathtracer": "./vendor/three-gpu-pathtracer/index.module.js" } }
</script>
</head>
<body>
<!--APP-START-->
<div class="app" id="app">
  <header class="top">
    <div class="brand" id="brand" title="回到首頁（想做什麼？）" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 10.5h18" stroke="var(--accent)" stroke-width="3" opacity=".85"/><path d="M9.5 20v-5h5v5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>新家 3D</span>
    </div>
    <nav class="tabs" id="planTabs" aria-label="平面方案"></nav>
    <div class="actions">
      <button class="btn accent" id="btnGen" title="輸入需求（幾房、要什麼），自動產生並比較多種格局">
        <svg viewBox="0 0 20 20"><path d="M4 16 13 7m1.5-4 .6 1.6L16.7 5l-1.6.6L14.5 7l-.6-1.4L12.3 5l1.6-.4zM5 3l.5 1.2L6.7 5l-1.2.5L5 6.7l-.5-1.2L3.3 5l1.2-.5zm11 7 .4 1 1 .4-1 .4-.4 1-.4-1-1-.4 1-.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>自動規劃</span>
      </button>
      <button class="btn accent" id="btnAsk" title="用打字或說話改格局、外觀，例如「主臥大一點」「二樓改自住」">
        <svg viewBox="0 0 20 20"><path d="M4 4h12a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 16 14H9l-4 3v-3H4a1.5 1.5 0 0 1-1.5-1.5v-7A1.5 1.5 0 0 1 4 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.5 8.5h7M6.5 11h4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>用講的改</span>
      </button>
      <button class="btn" id="btnSite" title="設定房子外面的狀況（座向、隔壁、馬路），模擬採光與日照">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>外面狀況</span>
      </button>
      <button class="btn" id="btnOpen" title="開啟 DXF / PDF / 圖片 / 專案檔">
        <svg viewBox="0 0 20 20"><path d="M3 5h5l2 2h7v8H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>開啟</span>
      </button>
      <div class="menu">
        <button class="btn primary" id="btnExport" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 20 20"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 14v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>匯出</span>
        </button>
        <div class="menu-pop" id="exportMenu" hidden>
          <button data-export="dxf"><b>DXF</b><small>給 AutoCAD 開啟的 CAD 圖檔</small></button>
          <button data-export="glb"><b>GLB</b><small>3D 模型（SketchUp、Blender、手機 AR）</small></button>
          <button data-export="png"><b>PNG</b><small>目前 3D 畫面截圖</small></button>
          <button data-export="json"><b>JSON</b><small>完整專案備份，可再匯入</small></button>
        </div>
      </div>
      <button class="btn icon" id="btnHelp" title="使用說明與導覽" aria-label="使用說明">?</button>
    </div>
  </header>

  <div class="work" id="work">
    <aside class="rail" id="rail" aria-label="工具">
      <button data-tool="select" title="選取與拖拉（V）"><svg viewBox="0 0 20 20"><path d="M5 3l10 6.2-4.4 1 2.6 5-2 .9-2.5-5L5 14z" fill="currentColor"/></svg><span>選取</span></button>
      <button class="adv" data-tool="wall" title="畫牆（W）：點擊連續畫，雙擊或 Esc 結束"><svg viewBox="0 0 20 20"><path d="M3 15V5h14" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/></svg><span>牆</span></button>
      <button class="adv" data-tool="door" title="門（D）：點在牆上"><svg viewBox="0 0 20 20"><path d="M4 16h3M16 16h-3M7 16V6a9 9 0 0 1 9 9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>門</span></button>
      <button class="adv" data-tool="sliding" title="推拉門：點在牆上"><svg viewBox="0 0 20 20"><path d="M3 9h8M9 12h8M3 6v8M17 6v8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>拉門</span></button>
      <button class="adv" data-tool="window" title="窗（N）：點在牆上"><svg viewBox="0 0 20 20"><path d="M3 7h14M3 13h14M3 10h14M3 7v6M17 7v6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>窗</span></button>
      <button class="adv" data-tool="opening" title="開口（無門）：點在牆上"><svg viewBox="0 0 20 20"><path d="M3 8h4M13 8h4M3 12h4M13 12h4M7 8v4M13 8v4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10h4" stroke="currentColor" stroke-dasharray="1.5 1.5"/></svg><span>開口</span></button>
      <button class="adv" data-tool="room" title="房間：點在牆圍起的區域內自動偵測"><svg viewBox="0 0 20 20"><path d="M4 4h12v12H4z" fill="currentColor" opacity=".25" stroke="currentColor" stroke-width="1.5"/></svg><span>房間</span></button>
      <button data-tool="item" id="btnCatalog" title="家具（F）"><svg viewBox="0 0 20 20"><rect x="3" y="7" width="14" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 7V5h10v2M4 15v2M16 15v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>家具</span></button>
      <button class="adv" data-tool="measure" title="量測（M）"><svg viewBox="0 0 20 20"><path d="M3 13 13 3l4 4L7 17z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 10l1.5 1.5M8.5 7.5 10 9M11 5l1.5 1.5" stroke="currentColor" stroke-width="1.3"/></svg><span>量測</span></button>
      <button data-cmd="mode" id="btnMode" title="顯示或隱藏畫牆、門窗、量測等進階工具"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="6" r="1.8" fill="var(--panel)" stroke="currentColor" stroke-width="1.4"/><circle cx="13" cy="10" r="1.8" fill="var(--panel)" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="14" r="1.8" fill="var(--panel)" stroke="currentColor" stroke-width="1.4"/></svg><span id="btnModeLabel">更多工具</span></button>
      <div class="rail-sep"></div>
      <button data-cmd="undo" title="復原（Ctrl+Z）"><svg viewBox="0 0 20 20"><path d="M7 5 3 9l4 4M3 9h9a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>復原</span></button>
      <button data-cmd="redo" title="重做（Ctrl+Shift+Z）"><svg viewBox="0 0 20 20"><path d="m13 5 4 4-4 4m4-4H8a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>重做</span></button>
      <button data-cmd="delete" title="刪除選取（Delete）"><svg viewBox="0 0 20 20"><path d="M5 6h10l-1 11H6zM3 6h14M8 6V3h4v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>刪除</span></button>
    </aside>

    <section class="pane pane2d" id="pane2d" aria-label="2D 平面圖">
      <svg id="plan2d" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="bld-stack" id="bldStack" hidden></div>
      <div class="pane-title"><span class="dot"></span><span id="pane2dTitle">平面</span> <small id="scaleLabel"></small></div>
      <div class="hint" id="toolHint"></div>
      <div class="pane-bar bl">
        <button id="zoomOut" title="縮小" aria-label="縮小">−</button>
        <button id="zoomFit" title="全圖">全圖</button>
        <button id="zoomIn" title="放大" aria-label="放大">+</button>
        <button id="toggleUnderlay" class="toggle adv" title="顯示媽媽的原圖當底圖">原圖</button>
        <button id="toggleDaylight" class="toggle" title="依基地條件模擬採光（顏色越亮代表越亮）">採光</button>
      </div>
      <div class="catalog" id="catalog" hidden></div>
    </section>

    <section class="pane pane3d" id="pane3d" aria-label="3D 模型">
      <div id="view3d"></div>
      <div class="pane-title"><span class="dot"></span>3D <small>拖曳旋轉 · 右鍵平移 · 滾輪縮放 · 點家具可直接拖動</small></div>
      <div class="view-bar">
        <div class="seg" id="viewSeg">
          <button data-view="iso" class="on">鳥瞰</button>
          <button data-view="top">俯視</button>
          <button data-view="front">正面</button>
          <button data-view="walk">漫遊</button>
        </div>
        <label class="cut bld-only" title="整棟外觀，或剖開某一層看裡面"><span>看</span><select id="floorSel" aria-label="看哪一層"></select></label>
        <label class="cut" title="把牆降低，看清室內"><span>牆高</span><input type="range" id="cutRange" min="40" max="300" step="10" value="160"><output id="cutOut">160 cm</output></label>
        <label class="cut style-pick plan-only" title="裝潢風格"><span>風格</span><select id="styleSel" aria-label="裝潢風格"></select></label>
        <button class="toggle on" id="toggleLabels3d">標籤</button>
        <button class="toggle" id="btnRender" title="用光線追蹤算出像照片的效果圖">📷 效果圖</button>
        <button class="toggle" id="btnPano" title="站在房間裡轉一圈看的 360° 環景">🌐 360°</button>
        <button class="toggle plan-only" id="toggleSun" title="依基地條件模擬某一天、某一時刻的日照與陰影">日照</button>
      </div>
      <div class="sun-bar" id="sunBar" hidden>
        <div class="sun-row">
          <select id="sunMonth" aria-label="月份"></select>
          <input type="range" id="sunHour" min="6" max="18" step="0.25" value="10" aria-label="時間">
          <output id="sunOut">10:00</output>
          <button id="sunPlay" title="播放一整天" aria-label="播放一整天">▶</button>
        </div>
        <div class="sun-info" id="sunInfo"></div>
      </div>
      <div class="walkpad" id="walkpad" hidden>
        <button data-walk="f" aria-label="前進">▲</button>
        <button data-walk="l" aria-label="左移">◀</button>
        <button data-walk="b" aria-label="後退">▼</button>
        <button data-walk="r" aria-label="右移">▶</button>
      </div>
    </section>

    <aside class="side" id="side" aria-label="屬性">
      <div class="side-tabs" id="sideTabs" role="tablist">
        <button data-tab="props" class="on" role="tab">屬性</button>
        <button data-tab="site" role="tab">基地・採光</button>
      </div>
      <div id="props"></div>
      <div id="sitePanel" hidden></div>
    </aside>
  </div>

  <nav class="mobile-switch" id="mobileSwitch">
    <button data-show="2d" class="on">平面</button>
    <button data-show="3d">3D</button>
    <button data-show="props">屬性</button>
  </nav>

  <div class="drop" id="drop" hidden><div><b>放開以匯入</b><span>DXF（CAD）・PDF・圖片・專案 JSON</span></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <input type="file" id="fileInput" hidden accept=".dxf,.json,.pdf,.png,.jpg,.jpeg,.webp,.dwg">
</div>
<script type="module" src="js/app.js"></script>
<!--APP-END-->
</body>
</html>
